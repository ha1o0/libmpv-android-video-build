name: Validate Android build automation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release tools without building native libraries
        run: |
          python3 -m unittest discover -s tests -v
          bash -n buildscripts/bundle_default.sh buildscripts/build.sh buildscripts/download.sh buildscripts/patch.sh buildscripts/flavors/default.sh scripts/test_audio_rematrix.sh
