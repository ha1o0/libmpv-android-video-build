name: Android libmpv release
run-name: Android libmpv ${{ inputs.release_tag || format('v0.0.0-ci.{0}', github.run_id) }} · ${{ inputs.request_id }}

on:
  push:
    branches: [codex/mobile-native-validation]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New prerelease tag, e.g. v1.1.9-android.1 (never reused)'
        required: true
        type: string
      request_id:
        description: 'Optional caller correlation ID (letters, digits, hyphens)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.release_tag || format('v0.0.0-ci.{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate inputs and release availability
        env:
          RELEASE_TAG: ${{ inputs.release_tag || format('v0.0.0-ci.{0}', github.run_id) }}
          REQUEST_ID: ${{ inputs.request_id }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/mobile_release.py identity --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT" --request-id "$REQUEST_ID" --workflow-run-id "$WORKFLOW_RUN_ID"
          python3 -m unittest discover -s tests -v
          bash scripts/test_audio_rematrix.sh
          bash scripts/test_mediacodec_dovi.sh
          python3 scripts/github_mobile_release.py preflight --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT" --request-id "$REQUEST_ID" --workflow-run-id "$WORKFLOW_RUN_ID"

  build:
    name: Build default flavor (four ABIs)
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Use runner Android SDK
        shell: bash
        run: |
          mkdir -p buildscripts/sdk
          ln -s "$ANDROID_HOME" buildscripts/sdk/android-sdk-linux
      - name: Build existing default bundle
        working-directory: buildscripts
        run: |
          set -o pipefail
          ./bundle_default.sh 2>&1 | tee "$RUNNER_TEMP/mobile-native-build.log"
      - name: Report native failure context
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'mobile-native-build.log'
          if path.exists():
              # GitHub truncates a single annotation; retain the actual final error.
              tail = '\n'.join(path.read_text(errors='replace').splitlines()[-25:])[-3500:]
              print('::error title=Native compiler output::' + tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYTHON
      - name: Require Dolby and DTS codecs in all four ABI libraries
        run: |
          . buildscripts/include/depinfo.sh
          python3 scripts/check_audio_codecs.py buildscripts/artifacts/default \
            --nm "buildscripts/sdk/android-sdk-linux/ndk/$v_ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
      - name: Validate and package release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag || format('v0.0.0-ci.{0}', github.run_id) }}
          REQUEST_ID: ${{ inputs.request_id }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/mobile_release.py package --directory buildscripts/artifacts/default --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT" --request-id "$REQUEST_ID" --workflow-run-id "$WORKFLOW_RUN_ID"
          python3 scripts/mobile_release.py verify --directory buildscripts/artifacts/default --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT" --request-id "$REQUEST_ID" --workflow-run-id "$WORKFLOW_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: buildscripts/artifacts/default/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols-${{ github.run_id }}-${{ github.run_attempt }}
          path: buildscripts/debug-symbols-default.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch'
    name: Publish immutable-name prerelease
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: android-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Revalidate and publish new tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || format('v0.0.0-ci.{0}', github.run_id) }}
          REQUEST_ID: ${{ inputs.request_id }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/github_mobile_release.py publish --directory release --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT" --request-id "$REQUEST_ID" --workflow-run-id "$WORKFLOW_RUN_ID"

  release-status:
    name: Android release status
    if: always()
    needs: [validate, build, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require completed validation, build and publication
        env:
          VALIDATION: ${{ needs.validate.result }}
          BUILD: ${{ needs.build.result }}
          PUBLICATION: ${{ needs.publish.result }}
        run: |
          printf 'Validation: %s; build: %s; publication: %s\n' "$VALIDATION" "$BUILD" "$PUBLICATION" >> "$GITHUB_STEP_SUMMARY"
          test "$VALIDATION" = success
          test "$BUILD" = success
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            test "$PUBLICATION" = success
          else
            test "$PUBLICATION" = skipped
          fi
